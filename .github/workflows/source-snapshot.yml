name: Build source snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-source-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate source snapshot
        shell: bash
        run: |
          mkdir -p public

          OUTPUT="public/source-snapshot.txt"

          {
            echo "NAM ENGLISH SOURCE SNAPSHOT"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "========================================"
            echo "PROJECT FILE TREE"
            echo "========================================"
            echo
          } > "$OUTPUT"

          find . \
            -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./dist/*" \
            ! -path "./public/source-snapshot.txt" \
            ! -name ".env" \
            ! -name ".env.local" \
            ! -name ".env.production" \
            ! -name "*.pem" \
            ! -name "*.key" \
            ! -name "*.crt" \
            ! -name "package-lock.json" \
            | sort >> "$OUTPUT"

          echo >> "$OUTPUT"
          echo "========================================" >> "$OUTPUT"
          echo "SOURCE CONTENT" >> "$OUTPUT"
          echo "========================================" >> "$OUTPUT"

          find src supabase scripts .github/workflows \
            -type f \
            \( \
              -name "*.js" -o \
              -name "*.jsx" -o \
              -name "*.ts" -o \
              -name "*.tsx" -o \
              -name "*.json" -o \
              -name "*.sql" -o \
              -name "*.css" -o \
              -name "*.md" -o \
              -name "*.yml" -o \
              -name "*.yaml" \
            \) \
            ! -name "source-snapshot.yml" \
            2>/dev/null \
            | sort \
            | while read -r file; do
                echo >> "$OUTPUT"
                echo "========================================" >> "$OUTPUT"
                echo "FILE: $file" >> "$OUTPUT"
                echo "========================================" >> "$OUTPUT"
                echo >> "$OUTPUT"
                cat "$file" >> "$OUTPUT"
                echo >> "$OUTPUT"
              done

          for file in package.json vite.config.js vercel.json index.html README.md; do
            if [ -f "$file" ]; then
              echo >> "$OUTPUT"
              echo "========================================" >> "$OUTPUT"
              echo "FILE: $file" >> "$OUTPUT"
              echo "========================================" >> "$OUTPUT"
              echo >> "$OUTPUT"
              cat "$file" >> "$OUTPUT"
              echo >> "$OUTPUT"
            fi
          done

      - name: Commit updated snapshot
        shell: bash
        run: |
          if git diff --quiet public/source-snapshot.txt; then
            echo "Snapshot has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/source-snapshot.txt
          git commit -m "chore: update source snapshot [skip ci]"
          git push
